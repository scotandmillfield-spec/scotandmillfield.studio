name: Monatliche Hörer aktualisieren

# Täglich ca. 6 Uhr deutscher Sommerzeit (04:00 UTC; im Winter 5 Uhr).
# Liest die Zahl von Spotify und öffnet bei einer Änderung einen Pull Request.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: monthly-listeners
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Hörerzahl von Spotify holen
        id: listeners
        run: node scripts/update-listeners.mjs

      - name: Pull Request öffnen oder aktualisieren
        if: steps.listeners.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VALUE: ${{ steps.listeners.outputs.listeners }}
        run: |
          BRANCH=auto/monthly-listeners
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git commit -am "Monatliche Hörer: $VALUE ($(date -u +%F))"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            gh pr create --head "$BRANCH" --base main \
              --title "Monatliche Hörer: $VALUE" \
              --body "Automatisch von Spotify gelesen am $(date -u +%F). Mergen bringt die neue Zahl auf die Homepage."
          else
            gh pr edit "$BRANCH" --title "Monatliche Hörer: $VALUE"
          fi
