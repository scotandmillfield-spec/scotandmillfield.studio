name: Deploy zu Strato

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Releases und strukturierte Daten ins HTML schreiben
        run: node scripts/build-releases.mjs

      - name: lftp installieren
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Per SFTP zu Strato hochladen
        env:
          SFTP_HOST: ${{ secrets.STRATO_HOST }}
          SFTP_USER: ${{ secrets.STRATO_USER }}
          LFTP_PASSWORD: ${{ secrets.STRATO_PASS }}
        # Erst CSS/JS/Bilder, die HTML-Seiten zuletzt: Wer während des Uploads lädt,
        # bekommt nie neues HTML mit alten Dateien (sonst landet Altes unter neuer ?v= im Cache).
        run: |
          lftp -c "set sftp:auto-confirm yes;
            open --user $SFTP_USER --env-password sftp://$SFTP_HOST;
            rm -r -f scotandmillfield/.git scotandmillfield/.github;
            mirror --reverse --delete --verbose \
              --exclude-glob .git/ --exclude-glob .github/ --exclude-glob epk/ --exclude-glob scripts/ --exclude-glob templates/ \
              --exclude-glob .gitkeep --exclude-glob .nojekyll --exclude-glob README.md \
              --exclude-glob *.html \
              ./ scotandmillfield;
            mput -O scotandmillfield *.html;
            chmod -R 755 scotandmillfield"
