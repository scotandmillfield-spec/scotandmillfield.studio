name: Deploy zu Strato

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: lftp installieren
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Per SFTP zu Strato hochladen
        env:
          SFTP_HOST: ${{ secrets.STRATO_HOST }}
          SFTP_USER: ${{ secrets.STRATO_USER }}
          LFTP_PASSWORD: ${{ secrets.STRATO_PASS }}
        run: |
          lftp -c "set sftp:auto-confirm yes;
            open --user $SFTP_USER --env-password sftp://$SFTP_HOST;
            mirror --reverse --delete --delete-excluded --verbose \
              --exclude-glob .git/ --exclude-glob .github/ \
              --exclude-glob .gitkeep --exclude-glob .nojekyll --exclude-glob README.md \
              ./ scotandmillfield"
