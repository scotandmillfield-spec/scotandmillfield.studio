<title>Morkant</title>
<meta name="description" content="Die Chroniken von Morkant.">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#060607">
<link rel="preload" href="assets/fonts/im-fell-english-sc-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" as="image" href="assets/img/ferryman-600.webp" media="(max-width: 600px)">

<body>
  <div class="backdrop" aria-hidden="true"></div>
  <div class="stage" aria-hidden="true">
    <picture>
      <source type="image/webp" srcset="assets/img/ferryman-600.webp 600w, assets/img/ferryman.webp 941w" sizes="(max-aspect-ratio: 941/1672) 100vw, 56vh">
      <img src="assets/img/ferryman.jpg" alt="" width="941" height="1672">
    </picture>
    <span class="lantern"></span>
  </div>
  <div class="fog fog--a" aria-hidden="true"></div>
  <div class="fog fog--b" aria-hidden="true"></div>

  <main class="gatehouse">
    <p class="kicker">Die Chroniken von</p>
    <h1>Morkant</h1>

    <form id="gate" class="gate" autocomplete="off">
      <label for="word" class="gate__prompt">Nenne das Wort, und der Fährmann setzt dich über.</label>
      <div class="gate__row">
        <input id="word" name="word" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="120" required>
        <button type="submit">Übersetzen</button>
      </div>
      <p id="answer" class="gate__answer" role="status" aria-live="polite"></p>
    </form>

    <section id="reward" class="reward" tabindex="-1" hidden aria-live="polite">
      <h2 class="reward__title"></h2>
      <div class="reward__ask">
        <p class="reward__question"></p>
        <div class="reward__choices">
          <button type="button" data-answer="yes">Ja</button>
          <button type="button" data-answer="no">Nein</button>
        </div>
      </div>
      <div class="reward__text" tabindex="-1" aria-live="polite"></div>
    </section>
  </main>
