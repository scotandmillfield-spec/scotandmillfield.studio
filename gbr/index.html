<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GbR Spike</title>
<style>
:root{--ink:#0B0D13;--panel:#13161F;--line:#252B39;--text:#E8EBF2;--muted:#8B94A8;--faint:#5B6376;--amber:#5DB1E6;--ok:#52E0A0;--bad:#FF6B8A}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:32px 18px 60px}
h1{font-size:26px;margin:0 0 4px} h2{font-size:17px;margin:0 0 12px}
p.lede{color:var(--muted);margin:0 0 24px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
label{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
input,select{background:var(--ink);border:1px solid var(--line);border-radius:8px;color:var(--text);font:14px Inter,system-ui,sans-serif;padding:8px 10px}
button{background:var(--ink);border:1px solid var(--line);border-radius:8px;color:var(--muted);font:12px ui-monospace,monospace;letter-spacing:.05em;text-transform:uppercase;padding:9px 14px;cursor:pointer}
button:hover{color:var(--text);border-color:var(--faint)} button.amber{color:var(--amber);border-color:rgba(93,177,230,.45)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
th{font:11px ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
td.num{text-align:right;font-family:ui-monospace,monospace}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 14px;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:ui-monospace,monospace}
.ok{color:var(--ok)} .bad{color:var(--bad)}
#msg{min-height:20px;font-size:13px;margin-top:10px}
.x{background:none;border:none;color:var(--faint);font-size:16px;padding:2px 6px} .x:hover{color:var(--bad)}
</style>
</head>
<body>
<div class="wrap">
  <h1>GbR · Datenbank-Spike</h1>
  <p class="lede">Testet die Kette Browser → api.php → MySQL. Nur Testdaten verwenden.</p>

  <div class="panel">
    <h2>1 · Verbindung</h2>
    <dl class="kv" id="health"><dt>Status</dt><dd>prüfe …</dd></dl>
    <div class="row" style="margin-top:14px">
      <label>Migrations-Token<input type="text" id="token" autocomplete="off" spellcheck="false"></label>
      <button class="amber" id="migrate" type="button">Migration ausführen</button>
      <button id="recheck" type="button">Neu prüfen</button>
    </div>
  </div>

  <div class="panel">
    <h2>2 · Testbuchung anlegen</h2>
    <div class="row">
      <label>Datum<input type="date" id="bDate"></label>
      <label>Soll<select id="bSoll"></select></label>
      <label>Haben<select id="bHaben"></select></label>
      <label>Betrag €<input type="number" step="0.01" id="bAmount" value="12.34" style="width:110px"></label>
      <label>Text<input type="text" id="bText" value="Testbuchung"></label>
      <button class="amber" id="add" type="button">Speichern</button>
    </div>
    <div id="msg"></div>
  </div>

  <div class="panel">
    <h2>3 · Buchungen in der Datenbank</h2>
    <table id="list"></table>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function api(action, data, headers){
  const r=await fetch("api.php?action="+action, data!==undefined?{method:"POST",headers:Object.assign({"Content-Type":"application/json"},headers||{}),body:JSON.stringify(data)}:{});
  let j; try{ j=await r.json(); }catch(e){ j={ok:false,error:"Keine JSON-Antwort (HTTP "+r.status+")"}; }
  if(!r.ok||!j.ok) throw new Error(j.error||("HTTP "+r.status));
  return j;
}
function msg(t,ok){ $("msg").innerHTML=`<span class="${ok?"ok":"bad"}">${esc(t)}</span>`; }

async function health(){
  try{
    const h=await api("health");
    $("health").innerHTML=`<dt>Status</dt><dd class="ok">verbunden</dd><dt>PHP</dt><dd>${esc(h.php)}</dd><dt>Datenbank</dt><dd>${esc(h.server)}</dd>
      <dt>Migrationen</dt><dd>${h.applied.length?esc(h.applied.join(", ")):"keine"}</dd>
      <dt>Ausstehend</dt><dd class="${h.pending.length?"bad":"ok"}">${h.pending.length?esc(h.pending.join(", ")):"keine"}</dd>`;
    if(!h.pending.length) await loadData();
  }catch(e){ $("health").innerHTML=`<dt>Status</dt><dd class="bad">${esc(e.message)}</dd>`; }
}
async function loadData(){
  const a=(await api("accounts")).accounts;
  const opts=a.map(x=>`<option value="${esc(x.nr)}">${esc(x.nr)} · ${esc(x.name)}</option>`).join("");
  $("bSoll").innerHTML=opts; $("bHaben").innerHTML=opts;
  $("bSoll").value="4200"; $("bHaben").value="1200";
  const b=(await api("bookings")).bookings;
  $("list").innerHTML="<tr><th>Nr.</th><th>Datum</th><th>Soll</th><th>Haben</th><th>Text</th><th style='text-align:right'>Betrag</th><th></th></tr>"+
    (b.length?b.map(x=>`<tr><td>${x.no}</td><td>${esc(x.date.split("-").reverse().join("."))}</td><td>${esc(x.soll)}</td><td>${esc(x.haben)}</td><td>${esc(x.text)}</td>
      <td class="num">${x.amount.toLocaleString("de-DE",{minimumFractionDigits:2})} €</td><td><button class="x" data-id="${x.id}" title="Löschen">×</button></td></tr>`).join("")
      :"<tr><td colspan='7' style='color:var(--faint)'>Noch keine Buchungen.</td></tr>");
  $("list").querySelectorAll("[data-id]").forEach(btn=>btn.onclick=async()=>{ try{ await api("booking_delete",{id:+btn.dataset.id}); msg("Gelöscht.",true); loadData(); }catch(e){ msg(e.message); } });
}
$("bDate").value=new Date().toISOString().slice(0,10);
$("recheck").onclick=health;
$("migrate").onclick=async()=>{ try{ const r=await api("migrate",{token:$("token").value}); msg(r.applied_now.length?"Migriert: "+r.applied_now.join(", "):"Nichts zu tun.",true); health(); }catch(e){ msg(e.message); } };
$("add").onclick=async()=>{ try{ const r=await api("booking_add",{date:$("bDate").value,soll:$("bSoll").value,haben:$("bHaben").value,amount:parseFloat($("bAmount").value),text:$("bText").value});
  msg("Gespeichert als Buchung Nr. "+r.no+".",true); loadData(); }catch(e){ msg(e.message); } };
health();
</script>
</body>
</html>
